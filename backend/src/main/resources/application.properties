spring.application.name=skillbridge-ai


# === Database connection ===

# Talk to springboot where db is located (Based on the variable in docker setup later, the variable will tell the connection URL)
spring.datasource.url=${SPRING_DATASOURCE_URL} 
# Refer to database username (Tell springboot which MySQL acc to use)
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Driver is the software component that allows Java to communicate with MySQL
# MySQL JDBC translate Java info into something that MySQL can understand
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# === JPA / Hibernate ===

# JPA is Java standard for mapping Java objects to database tables
# Hibernate is an implementation of JPA that can perform database operations for ur application

# This control how Hibernate handles databases tables when your application starts
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
# This determine whether Hibernate prints the SQL statements it executes to the application console
# Imagine if ur app wanna retrieve data, the retrieval will done in Java, now we need to switch SQL form
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
# This disables a springboot feature that can keep db session available
# Disabling Open Session in View encourages us to load the required data within the appropriate service or transaction layer
spring.jpa.open-in-view=false
